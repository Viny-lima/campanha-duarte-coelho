<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do Tesoureiro — Duarte Coelho</title>
<style>
  body{font-family:Inter,system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;color:#1a1a1a}
  h1{font-size:1.4rem}
  table{width:100%;border-collapse:collapse;margin-top:1rem}
  th,td{padding:.6rem;border-bottom:1px solid #ddd;text-align:left}
  button{padding:.4rem .8rem;border:0;border-radius:6px;cursor:pointer;font-weight:600}
  .ok{background:#1b7f3b;color:#fff}.no{background:#b3261e;color:#fff;margin-left:.4rem}
  #msg{margin-top:1rem;color:#b3261e}
</style>
</head>
<body>
<h1>Doações pendentes</h1>
<p>Aprove apenas doações cujo Pix você conferiu no extrato.</p>
<button id="login" class="ok">Entrar com Google</button>
<button id="logout" class="no" hidden>Sair</button>
<div id="msg"></div>
<table hidden id="tbl">
  <thead><tr><th>Data</th><th>Nome</th><th>Valor</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  "use strict";
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth = firebase.auth(), db = firebase.database();
  const $ = id => document.getElementById(id);
  const brl = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
  let ref = null;

  $('login').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(e => $('msg').textContent = 'Erro no login: ' + e.message);
  $('logout').onclick = () => auth.signOut();

  function render(snap){
    const rows = $('rows'); rows.textContent = '';
    $('msg').textContent = '';
    const data = snap.val() || {};
    const ids = Object.keys(data).sort((a,b) => data[b].timestamp - data[a].timestamp);
    if (!ids.length) $('msg').textContent = 'Nenhuma doação pendente.';
    ids.forEach(id => {
      const d = data[id], tr = document.createElement('tr');
      [d.date, d.name, brl.format(d.value)].forEach(t => {
        const td = document.createElement('td'); td.textContent = t; tr.appendChild(td);
      });
      const td = document.createElement('td');
      const ok = document.createElement('button'); ok.className='ok'; ok.textContent='Aprovar';
      ok.onclick = () => db.ref().update({['donations/'+id]: d, ['pending/'+id]: null}).catch(fail);
      const no = document.createElement('button'); no.className='no'; no.textContent='Rejeitar';
      no.onclick = () => db.ref('pending/'+id).remove().catch(fail);
      td.append(ok, no); tr.appendChild(td); rows.appendChild(tr);
    });
  }
  function fail(e){ $('msg').textContent = 'Operação negada: ' + e.message; }

  auth.onAuthStateChanged(user => {
    if (ref) { ref.off(); ref = null; }
    const logged = !!user && !user.isAnonymous;
    $('login').hidden = logged; $('logout').hidden = !logged; $('tbl').hidden = !logged;
    if (!logged) return;
    ref = db.ref('pending');
    ref.on('value', render, e => { $('tbl').hidden = true; fail(e); });
  });
})();
</script>
</body>
</html>
